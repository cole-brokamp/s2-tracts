[package]
name = "s2-tracts"
version = "0.3.0"
edition = "2024"
description = "S2 lookup of annual TIGER/Line Census tract vintages"
license = "MIT"
repository = "https://github.com/cole-brokamp/s2-tracts"
exclude = ["/work", "/dist"]

[[bin]]
name = "s2-tracts"
path = "src/main.rs"

[[bin]]
name = "prepare-tracts"
path = "src/prepare.rs"
required-features = ["data-prep"]

[features]
data-prep = ["dep:geozero"]

[dependencies]
s2 = { version = "0.2.0", default-features = false }
flatgeobuf = { version = "6.0.1", default-features = false }
geo = { version = "0.32", default-features = false }
thiserror = "2"
serde_json = "1"
zstd = "0.13.3"
geozero = { version = "0.15.1", default-features = false, features = ["with-geo"], optional = true }

[dev-dependencies]
geozero = { version = "0.15.1", default-features = false, features = ["with-geo"] }
tempfile = "3"
