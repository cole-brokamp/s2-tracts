name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.1.0
        required: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG"

  binary:
    needs: draft
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
          - runner: macos-15
            os: macos
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: s2-tracts-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          cargo build --release --locked
          cp target/release/s2-tracts "$ASSET"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          else
            sha256sum "$ASSET" > "$ASSET.sha256"
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber
